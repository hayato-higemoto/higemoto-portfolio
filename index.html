<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Higemoto's portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 方向A：校正紙（プルーフ）。印刷物を見せるので、各作品をトンボ付きの版として並べる */
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#f2f0ea;--sub:#8a8780;--line:#3a3936;--mark:#bdbab2}
html,body{background:#000;color:var(--ink)}
body{font-family:"IBM Plex Mono","Noto Sans CJK JP",monospace;-webkit-font-smoothing:antialiased}
header{padding:28px 20px 22px;border-bottom:1px solid var(--line)}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:10px;letter-spacing:.08em;color:var(--sub);text-transform:uppercase}
h1{font-family:"Archivo",sans-serif;font-stretch:68%;font-weight:850;font-size:clamp(46px,16.5vw,128px);line-height:.88;letter-spacing:-.005em;margin-top:18px;overflow-wrap:anywhere}
h1 span{display:block}
h1 .p{color:var(--sub);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:8px 20px 40px}
.grid{display:grid;grid-template-columns:1fr;column-gap:40px}
@media(min-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1080px){.grid{grid-template-columns:repeat(3,1fr)}}
.plate{all:unset;display:block;cursor:zoom-in;padding:26px 0 8px;border-bottom:1px solid var(--line)}
.plate:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.frame{position:relative;padding:12px}
/* トンボ（角の裁ち線） */
.frame::before,.frame::after,.frame i::before,.frame i::after{content:"";position:absolute;width:14px;height:14px;border-color:var(--mark);border-style:solid;pointer-events:none}
.frame::before{top:0;left:0;border-width:1px 0 0 1px}
.frame::after{top:0;right:0;border-width:1px 1px 0 0}
.frame i::before{bottom:0;left:0;border-width:0 0 1px 1px}
.frame i::after{bottom:0;right:0;border-width:0 1px 1px 0}
.img{aspect-ratio:1/1;background:#111;overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s}
.img img.loaded{opacity:1}
.cap{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:.06em;color:var(--sub);padding:10px 12px 4px}
.cap b{font-family:"Archivo",sans-serif;font-stretch:68%;font-weight:800;font-size:22px;color:var(--ink);letter-spacing:0}
#sentinel{height:1px}
footer{display:flex;flex-direction:column;align-items:center;gap:16px;color:var(--sub);font-size:10px;letter-spacing:.08em;padding:18px 20px 36px;border-top:1px solid var(--line);max-width:1180px;margin:0 auto}
#lb{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:10}
#lb.open{display:flex}
#lb .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-size:11px;color:var(--sub);letter-spacing:.08em;border-bottom:1px solid var(--line)}
#lb button{background:none;border:1px solid var(--line);color:var(--ink);font:500 11px "IBM Plex Mono","Noto Sans CJK JP",monospace;padding:8px 12px;letter-spacing:.08em}
#lb .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out;min-height:0}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
.social{display:flex;gap:14px}
.social a{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;color:var(--ink)}
.social a:hover,.social a:focus-visible{border-color:var(--ink)}
.social svg{width:20px;height:20px;fill:currentColor}
</style>
</head>
<body>
<header>
  <div class="meta"><span>Logo · Print · Sticker</span><span id="count">— plates</span></div>
  <h1><span>Higemoto's</span><span class="p">portfolio</span></h1>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div id="sentinel"></div>
</main>
<footer><nav class="social" aria-label="SNS"><a href="https://x.com/hige_no_moto" target="_blank" rel="noopener" aria-label="X"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></a><a href="https://www.instagram.com/motogram_jp" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.16c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.42.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.42.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41a3.7 3.7 0 0 1-1.38-.9 3.7 3.7 0 0 1-.9-1.38c-.16-.42-.36-1.06-.41-2.23C2.17 15.58 2.16 15.2 2.16 12s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.42-.16 1.06-.36 2.23-.41C8.42 2.17 8.8 2.16 12 2.16M12 0C8.74 0 8.33.01 7.05.07 5.78.13 4.9.33 4.14.63a5.9 5.9 0 0 0-2.13 1.38A5.9 5.9 0 0 0 .63 4.14C.33 4.9.13 5.78.07 7.05.01 8.33 0 8.74 0 12s.01 3.67.07 4.95c.06 1.27.26 2.15.56 2.91.31.79.72 1.46 1.38 2.13a5.9 5.9 0 0 0 2.13 1.38c.76.3 1.64.5 2.91.56C8.33 23.99 8.74 24 12 24s3.67-.01 4.95-.07c1.27-.06 2.15-.26 2.91-.56a5.9 5.9 0 0 0 2.13-1.38 5.9 5.9 0 0 0 1.38-2.13c.3-.76.5-1.64.56-2.91.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95c-.06-1.27-.26-2.15-.56-2.91a5.9 5.9 0 0 0-1.38-2.13A5.9 5.9 0 0 0 19.86.63C19.1.33 18.22.13 16.95.07 15.67.01 15.26 0 12 0zm0 5.84a6.16 6.16 0 1 0 0 12.32 6.16 6.16 0 0 0 0-12.32zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.4-11.85a1.44 1.44 0 1 0 0 2.88 1.44 1.44 0 0 0 0-2.88z"/></svg></a></nav><span>&copy; Higemoto</span></footer>
<div id="lb" role="dialog" aria-modal="true" aria-label="作品の拡大表示">
  <div class="bar"><span id="lbNo"></span><button id="lbClose">閉じる ×</button></div>
  <div class="stage"><img alt=""></div>
</div>
<script>
const BASE='';
const PAGE=5;let works=[],shown=0;
const grid=document.getElementById('grid');
const lb=document.getElementById('lb'),lbImg=lb.querySelector('img'),lbNo=document.getElementById('lbNo');
const pad=n=>String(n).padStart(2,'0');
function next(){
  works.slice(shown,shown+PAGE).forEach((w,k)=>{
    const no=works.length-(shown+k); // 新しいほど大きい番号
    const b=document.createElement('button');b.className='plate';b.setAttribute('aria-label','作品 No.'+pad(no)+' を拡大');
    b.innerHTML='<div class="frame"><i></i><div class="img"></div></div><div class="cap"><span>No.</span><b>'+pad(no)+'</b></div>';
    const im=new Image();im.alt=w.title||"Higemoto's work No."+pad(no);im.decoding='async';
    im.onload=()=>im.classList.add('loaded');im.src=BASE+w.src;
    b.querySelector('.img').appendChild(im);
    b.onclick=()=>{lbImg.src=BASE+w.src;lbImg.alt=im.alt;lbNo.textContent='No.'+pad(no)+' / '+pad(works.length);lb.classList.add('open');document.getElementById('lbClose').focus()};
    grid.appendChild(b);
  });
  shown=Math.min(shown+PAGE,works.length);
}
const close=()=>lb.classList.remove('open');
lb.querySelector('.stage').onclick=close;document.getElementById('lbClose').onclick=close;
addEventListener('keydown',e=>{if(e.key==='Escape')close()});
fetch(BASE+'works.json').then(r=>r.json()).then(j=>{
  works=j;document.getElementById('count').textContent=pad(j.length)+' plates';next();
  // 最初は必ず5枚。利用者が実際にスクロールしてから、下端に近づくたびに次の5枚を読む
  const sen=document.getElementById('sentinel');let scrolled=false;
  const check=()=>{if(!scrolled||shown>=works.length)return;const r=sen.getBoundingClientRect();if(r.top<innerHeight+200)next()};
  addEventListener('scroll',()=>{scrolled=true;check()},{passive:true});
});
</script>
</body>
</html>
